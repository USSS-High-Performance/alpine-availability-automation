name: Alpine Availability Automation

on:
  schedule:
    # Every 10 minutes. Scheduled workflows only run on the repo's default
    # branch - this won't fire until this workflow file is merged there.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Don't let a slow run overlap with the next scheduled one.
concurrency:
  group: alpine-availability
  cancel-in-progress: false

jobs:
  push-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # These replace the .env file. Sys.getenv() in the script reads them unchanged.
      SB_USERNAME: ${{ secrets.SB_USERNAME }}
      SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
      TZ: America/Denver

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Note: pak reads every line below as a package reference.
      # Do not put comments inside the `packages:` block.
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::lubridate
            any::purrr
            any::dotenv
            github::Teamworksapp/smartabaseR

      - name: Run send_update_script.R
        run: Rscript send_update_script.R
