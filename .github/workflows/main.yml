name: Alpine Availability Automation

on:
  schedule:
    # 13:00 UTC daily = 06:00 Mountain Standard / 07:00 Mountain Daylight.
    # GitHub cron is always UTC and does not shift for DST.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # also lets you trigger a run by hand from the Actions tab

# Don't let a slow run overlap with the next scheduled one.
concurrency:
  group: alpine-availability
  cancel-in-progress: false

jobs:
  push-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # These replace the .env file. Sys.getenv() in the script reads them unchanged.
      SB_USERNAME: ${{ secrets.SB_USERNAME }}
      SB_PASSWORD: ${{ secrets.SB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Note: pak reads every line below as a package reference.
      # Do not put comments inside the `packages:` block.
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::lubridate
            any::purrr
            any::dotenv
            github::OWNER/smartabaseR

      - name: Run alpine-availability-automation.R
        run: Rscript alpine-availability-automation.R
